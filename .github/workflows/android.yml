name: Android baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Summarize executed storage tests
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in reports:
              suite = ElementTree.parse(path).getroot()
              counts = {key: int(suite.attrib.get(key, 0)) for key in totals}
              print(suite.attrib['name'], counts)
              for key, value in counts.items():
                  totals[key] += value
          print('STORAGE_TEST_TOTALS:', totals)
          assert totals['tests'] > 0, 'No storage tests executed'
          assert totals['failures'] == totals['errors'] == 0, 'Storage tests failed'
          PY
      - name: Verify exported Room schema contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          schemas = sorted(Path('app/schemas').rglob('*.json'))
          assert schemas, 'No Room schema exported'
          for path in schemas:
              committed = subprocess.check_output(['git', 'show', f'HEAD:{path.as_posix()}'], text=True)
              assert json.loads(committed) == json.loads(path.read_text()), f'Uncommitted schema change: {path}'
              print('Room schema contract verified:', path)
          PY
      - name: Upload storage test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-storage-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bulgariantrainer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
